apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: abone-provisioning

resources:
  - namespace.yaml
  - config.yaml
  - oracle.yaml
  - artemis.yaml
  - app.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: abone-provisioning
    includeSelectors: false

# Gercek ortamda sifreler Vault / SealedSecret'tan gelir; burada yalnizca yerel deneme degerleri
secretGenerator:
  - name: abone-sifreler
    literals:
      - ORACLE_PASSWORD=abone
      - ORACLE_SYS_PASSWORD=sys_parola
      - ARTEMIS_PASSWORD=artemis

images:
  - name: abone-provisioning
    newName: abone-provisioning
    newTag: yerel
