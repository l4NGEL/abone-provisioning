apiVersion: v1
kind: Service
metadata:
  name: artemis
spec:
  selector:
    app.kubernetes.io/name: artemis
  ports:
    - name: core
      port: 61616
    - name: konsol
      port: 8161
---
# Kalici mesajlar icin journal PVC'de; tek broker. HA (canli/yedek cifti) bu ornegin kapsami disinda.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: artemis
spec:
  serviceName: artemis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: artemis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: artemis
    spec:
      containers:
        - name: artemis
          image: apache/activemq-artemis:2.42.0-alpine
          env:
            - name: ARTEMIS_USER
              value: artemis
            - name: ARTEMIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: abone-sifreler
                  key: ARTEMIS_PASSWORD
            - name: ANONYMOUS_LOGIN
              value: "false"
          ports:
            - name: core
              containerPort: 61616
            - name: konsol
              containerPort: 8161
          readinessProbe:
            tcpSocket:
              port: core
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: journal
              mountPath: /var/lib/artemis-instance/data
  volumeClaimTemplates:
    - metadata:
        name: journal
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
