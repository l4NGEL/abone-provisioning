apiVersion: v1
kind: Service
metadata:
  name: abone-provisioning
spec:
  selector:
    app.kubernetes.io/name: abone-provisioning
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Headless servis: StatefulSet pod kimlikleri icin
apiVersion: v1
kind: Service
metadata:
  name: abone-provisioning-pod
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: abone-provisioning
  ports:
    - name: http
      port: 8080
---
# Deployment degil StatefulSet: her pod XA islem log'unu kendi PVC'sinde tutar ve sabit bir
# Atomikos tm_unique_name (pod adi) kullanir. Pod yeniden olustugunda ayni adla ayni log'u
# bulur ve commit/rollback karari yarim kalmis 2PC'leri tamamlar.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: abone-provisioning
spec:
  serviceName: abone-provisioning-pod
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: abone-provisioning
  template:
    metadata:
      labels:
        app.kubernetes.io/name: abone-provisioning
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
      containers:
        - name: app
          image: abone-provisioning
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: abone-ayarlar
          env:
            - name: ATOMIKOS_TM_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ORACLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: abone-sifreler
                  key: ORACLE_PASSWORD
            - name: ARTEMIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: abone-sifreler
                  key: ARTEMIS_PASSWORD
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
          lifecycle:
            preStop:
              # servis uc noktalarindan cikarilmayi bekle, sonra devam eden XA islemlerini bitir
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: atomikos
              mountPath: /var/lib/abone/atomikos
  volumeClaimTemplates:
    - metadata:
        name: atomikos
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 256Mi
