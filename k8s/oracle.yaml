# Gelistirme/test kumesi icin. Uretimde Oracle kume disinda (RAC/Exadata) yonetilir;
# o durumda bu dosya kustomization'dan cikarilir ve ORACLE_URL guncellenir.
# db/init/01_xa_yetkileri.sql ile ayni icerik (kustomize kok dizin disindan dosya okumaz)
apiVersion: v1
kind: ConfigMap
metadata:
  name: oracle-init
data:
  01_xa_yetkileri.sql: |
    ALTER SESSION SET CONTAINER = FREEPDB1;
    GRANT SELECT ON SYS.DBA_PENDING_TRANSACTIONS TO ABONE;
    GRANT FORCE ANY TRANSACTION TO ABONE;
    GRANT EXECUTE ON SYS.DBMS_XA TO ABONE;
---
apiVersion: v1
kind: Service
metadata:
  name: oracle
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: oracle
  ports:
    - name: sql
      port: 1521
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oracle
spec:
  serviceName: oracle
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oracle
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oracle
    spec:
      containers:
        - name: oracle
          image: gvenzl/oracle-free:23-slim-faststart
          env:
            - name: APP_USER
              value: abone
            - name: APP_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: abone-sifreler
                  key: ORACLE_PASSWORD
            - name: ORACLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: abone-sifreler
                  key: ORACLE_SYS_PASSWORD
          ports:
            - name: sql
              containerPort: 1521
          readinessProbe:
            exec:
              command: ["healthcheck.sh"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              memory: 3Gi
          volumeMounts:
            - name: veri
              mountPath: /opt/oracle/oradata
            - name: init
              mountPath: /container-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: oracle-init
  volumeClaimTemplates:
    - metadata:
        name: veri
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
